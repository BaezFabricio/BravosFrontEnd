<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bravos Box</title>
    <meta name="description" content="Reservá tus clases, seguí tu plan y pagá tu membresía de Bravos Box." />
    <!-- App instalable (PWA): color de la barra del celular según el modo claro u oscuro -->
    <meta name="theme-color" content="#e9e7e1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Bravos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=Archivo:wdth,wght@62..125,100..900&family=Big+Shoulders+Stencil+Display:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Panel de administración: aplica el modo guardado antes de dibujar la página (sin parpadeo) -->
    <!-- Pantalla de arranque: se ve enseguida, mientras carga el código de la app (la quita main.jsx al montar) -->
    <style>
      /* Solo en el celular (menos de 900 px): en escritorio queda el esqueleto de carga de siempre */
      #arranque { display: none; }
      @media (max-width: 899px) { #arranque { display: flex; } }
      #arranque { position: fixed; inset: 0; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; background: #0a0a0a; transition: opacity 0.35s ease, visibility 0.35s; }
      #arranque.salir { opacity: 0; visibility: hidden; }
      @media (prefers-color-scheme: light) { #arranque { background: #e9e7e1; } }
      #arranque img { width: 88px; height: 88px; border-radius: 20px; object-fit: cover; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); animation: arranque-subir 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      #arranque .arranque-barra { width: 120px; height: 3px; border-radius: 9px; background: rgba(163, 230, 53, 0.15); overflow: hidden; }
      #arranque .arranque-barra span { display: block; height: 100%; width: 40%; border-radius: 9px; background: #a3e635; animation: arranque-correr 1.1s ease-in-out infinite; }
      @keyframes arranque-subir { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes arranque-correr { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #arranque img, #arranque .arranque-barra span { animation: none; } }
      html.sin-arranque #arranque { display: none !important; }
    </style>
    <script>
      // La pantalla de arranque sale solo al entrar a la app (una vez por sesión), no al cambiar de módulo ni al recargar
      (function () {
        try {
          if (sessionStorage.getItem("bravos-arranque")) document.documentElement.classList.add("sin-arranque");
          else sessionStorage.setItem("bravos-arranque", "1");
        } catch (e) { /* sin almacenamiento: se muestra siempre */ }
      })();
    </script>
    <script>
      (function () {
        try {
          if (!location.pathname.startsWith("/admin") || window.innerWidth < 1024) return; // celular y tableta no usan la paleta del panel de escritorio
          var modo = localStorage.getItem("bravos-admin-tema-modo");
          var sistemaOscuro = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var oscuro = modo === "oscuro" ? true : modo === "claro" ? false : sistemaOscuro;
          var tema = oscuro ? "oscuro" : "claro";
          document.documentElement.classList.add("bv-admin");
          document.documentElement.setAttribute("data-bv-tema", tema);
        } catch (e) { /* sin acceso al almacenamiento: se usa el modo oscuro por defecto */ }
      })();
    </script>
  </head>
  <body>
    <div id="arranque" role="status" aria-label="Cargando Bravos Box">
      <img src="/logo.jpg" alt="" />
      <div class="arranque-barra"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
